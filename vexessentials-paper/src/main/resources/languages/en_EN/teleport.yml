duration:
  second: "1 second"
  seconds: "%seconds% seconds"
player-not-found: "<tailwind:red>The player <tailwind:red:7>%player%<tailwind:red> could not be found."
player-offline: "<tailwind:red>The player <tailwind:red:7>%player%<tailwind:red> is not currently online."
direct:
  success: "<tailwind:zinc:4>You were teleported to <tailwind:sky>%player%<tailwind:zinc:4> <tailwind:lime>successfully<tailwind:zinc:4>."
  other-success: "<tailwind:sky>%player%<tailwind:zinc:4> was teleported to <tailwind:sky>%target%<tailwind:zinc:4> <tailwind:lime>successfully<tailwind:zinc:4>."
  moved: "<tailwind:zinc:4>You were teleported to <tailwind:sky>%player%<tailwind:zinc:4> by a staff member."
  queued: "<tailwind:zinc:4>The cross-server teleport for <tailwind:sky>%player%<tailwind:zinc:4> is now being prepared."
back:
  success: "<tailwind:zinc:4>You returned to your previous position <tailwind:lime>successfully<tailwind:zinc:4>."
  empty: "<tailwind:red>You do not have a previous position to return to."
warmup:
  started: "<tailwind:zinc:4>Your teleport will begin in <tailwind:amber>%remaining_time%<tailwind:zinc:4>. Please remain still."
  countdown: "<tailwind:zinc:4>Your teleport will begin in <tailwind:amber>%remaining_time%<tailwind:zinc:4>. Please remain still."
  cancelled-move: "<tailwind:red>Your teleport was cancelled because you moved."
  cancelled-damage: "<tailwind:red>Your teleport was cancelled because you took damage."
error:
  unavailable: "<tailwind:red>The teleport service is currently unavailable. Please try again shortly."
  position: "<tailwind:red>Your current position could not be determined, so the request was not accepted."
  dialog: "<tailwind:red>The confirmation dialog could not be opened. Your request remains unchanged."
  presentation: "<tailwind:red>The teleport request could not be displayed correctly. Please use <tailwind:red:7>/tpa accept<tailwind:red> instead."
request:
  self: "<tailwind:red>You cannot send a teleport request to yourself."
  cooldown: "<tailwind:red>Please wait <tailwind:amber>%remaining_time%<tailwind:red> before sending another teleport request."
  none: "<tailwind:red>You do not have a matching pending teleport request."
  no-outgoing: "<tailwind:red>You do not have an outgoing teleport request that can be cancelled."
  expired: "<tailwind:red>This teleport request has already expired."
  already-handled: "<tailwind:red>This teleport request has already been handled."
  delivery-failed: "<tailwind:red>Your teleport request could not be delivered to <tailwind:red:7>%player%<tailwind:red>."
  sent:
    message: "<tailwind:zinc:4>Your teleport request to <tailwind:sky>%player%<tailwind:zinc:4> was sent <tailwind:lime>successfully<tailwind:zinc:4>."
    hover-text:
      - "<tailwind:zinc:4>The request expires after <tailwind:amber>%request_expiration_time%<tailwind:zinc:4>."
      - "<tailwind:zinc:7>You can cancel it with <tailwind:sky>/tpa cancel<tailwind:zinc:7>."
  received:
    to-you:
      message: "<tailwind:sky>%player%<tailwind:zinc:4> would like to teleport to you. <tailwind:sky>Click here<tailwind:zinc:4> to review the request."
      hover-text:
        - "<tailwind:zinc:4>Review the teleport request from <tailwind:sky>%player%<tailwind:zinc:4>."
        - ""
        - "<tailwind:zinc:7>The request expires after <tailwind:amber>%request_expiration_time%<tailwind:zinc:7>."
        - "<tailwind:sky>Click to view more information."
    teleport-you:
      message: "<tailwind:sky>%player%<tailwind:zinc:4> would like you to teleport to them. <tailwind:sky>Click here<tailwind:zinc:4> to review the request."
      hover-text:
        - "<tailwind:zinc:4>Review the teleport-here request from <tailwind:sky>%player%<tailwind:zinc:4>."
        - ""
        - "<tailwind:zinc:7>The request expires after <tailwind:amber>%request_expiration_time%<tailwind:zinc:7>."
        - "<tailwind:sky>Click to view more information."
  accepted-target: "<tailwind:zinc:4>You <tailwind:lime>accepted<tailwind:zinc:4> the teleport request from <tailwind:sky>%player%<tailwind:zinc:4>."
  denied-target: "<tailwind:zinc:4>You <tailwind:red>denied<tailwind:zinc:4> the teleport request from <tailwind:sky>%player%<tailwind:zinc:4>."
  denied-requester: "<tailwind:red:7>%player%<tailwind:red> denied your teleport request."
  cancelled-requester: "<tailwind:zinc:4>You cancelled your teleport request to <tailwind:sky>%player%<tailwind:zinc:4>."
  cancelled-target: "<tailwind:sky>%player%<tailwind:zinc:4> cancelled their teleport request."
  expired-notice: "<tailwind:amber>The teleport request involving <tailwind:sky>%player%<tailwind:amber> has expired."
  completed: "<tailwind:zinc:4>The teleport involving <tailwind:sky>%player%<tailwind:zinc:4> was completed <tailwind:lime>successfully<tailwind:zinc:4>."
  failed: "<tailwind:red>The teleport involving <tailwind:red:7>%player%<tailwind:red> could not be completed."
  dialog:
    title: "<tailwind:sky>Teleport request"
    teleport-to-you:
      - "<tailwind:sky>%player%<tailwind:zinc:4> would like to teleport to your current position."
      - "<tailwind:zinc:7>This request expires after <tailwind:amber>%request_expiration_time%<tailwind:zinc:7>."
    teleport-you-there:
      - "<tailwind:sky>%player%<tailwind:zinc:4> would like you to teleport to their current position."
      - "<tailwind:zinc:7>This request expires after <tailwind:amber>%request_expiration_time%<tailwind:zinc:7>."
    confirm-button: "<tailwind:lime>Accept request"
    confirm-tooltip: "<tailwind:zinc:4>Accept this request and begin the teleport."
    deny-button: "<tailwind:red>Decline request"
    deny-tooltip: "<tailwind:zinc:4>Decline this request and notify <tailwind:sky>%player%<tailwind:zinc:4>."
