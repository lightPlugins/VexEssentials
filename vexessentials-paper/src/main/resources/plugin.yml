name: VexEssentials
version: ${version}
main: dev.vexsoft.essentials.paper.VexEssentialsPlugin
api-version: "1.21"
load: STARTUP
description: Essential server features built on VexCore
folia-supported: true
depend:
  - VexCore
permissions:
  vexessentials.command.teleport:
    description: Allows direct player teleports
    default: op
  vexessentials.command.teleport.others:
    description: Allows teleporting one player to another
    default: op
  vexessentials.command.teleport.here:
    description: Allows teleporting another player to you
    default: op
  vexessentials.command.tpa:
    description: Allows teleport requests
    default: true
  vexessentials.command.tpa.here:
    description: Allows teleport-here requests
    default: true
  vexessentials.command.tpa.accept:
    description: Allows accepting teleport requests
    default: true
  vexessentials.command.tpa.deny:
    description: Allows denying teleport requests
    default: true
  vexessentials.command.tpa.cancel:
    description: Allows cancelling teleport requests
    default: true
  vexessentials.command.back:
    description: Allows returning to the previous position
    default: true
