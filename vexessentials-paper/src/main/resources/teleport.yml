requests:
  expiration-seconds: 60
  cooldown-seconds: 5
  maximum-cached: 10000

network:
  timeout-seconds: 5

teleport:
  warmup-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

# Namespaced Adventure keys also support custom resource-pack sounds such as nexo:teleport_request.
sounds:
  request-sent:
    enabled: true
    key: minecraft:block.note_block.pling
    source: player
    volume: 0.8
    pitch: 1.2
  request-received:
    enabled: true
    key: minecraft:block.note_block.pling
    source: player
    volume: 0.9
    pitch: 1.0
  request-accepted:
    enabled: true
    key: minecraft:entity.player.levelup
    source: player
    volume: 0.8
    pitch: 1.1
  request-denied:
    enabled: true
    key: minecraft:block.note_block.bass
    source: player
    volume: 0.8
    pitch: 0.8
  warmup-start:
    enabled: true
    key: minecraft:block.note_block.hat
    source: player
    volume: 0.7
    pitch: 1.1
  teleport-cancelled:
    enabled: true
    key: minecraft:block.note_block.bass
    source: player
    volume: 0.8
    pitch: 0.7
  teleport-success:
    enabled: true
    key: minecraft:entity.enderman.teleport
    source: player
    volume: 0.8
    pitch: 1.0
  teleport-failed:
    enabled: true
    key: minecraft:block.note_block.bass
    source: player
    volume: 0.8
    pitch: 0.6
